<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>notToshu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    position: fixed;
    inset: 0;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #0d0b18;
    background-image:
      radial-gradient(circle at 78% 22%, rgba(255, 200, 140, 0.10), transparent 45%),
      radial-gradient(circle at 20% 80%, rgba(255, 150, 160, 0.06), transparent 50%);
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
  }

  /* ───────── Boy ───────── */
  .person-wrap {
    position: absolute;
    right: 45%;
    bottom: 0;
    height: 50vh;
    z-index: 3;
    pointer-events: none;
    transform-origin: 50% 100%;
    will-change: transform;
    animation: alive-boy 6s ease-in-out infinite;
  }
  .person {
    height: 100%; width: auto; display: block;
    object-fit: contain; user-select: none;
  }
  @keyframes alive-boy {
    0%, 100% { transform: translateY(0)    rotate(0deg)    scale(1); }
    20%      { transform: translateY(-4px) rotate(-0.7deg) scale(1.006, 1.014); }
    50%      { transform: translateY(-7px) rotate(0deg)    scale(1.010, 1.022); }
    80%      { transform: translateY(-4px) rotate(0.7deg)  scale(1.006, 1.014); }
  }

  .person-wrap::before {
    content: "";
    position: absolute;
    inset: -30% -45% -22% -45%;
    background: radial-gradient(
      ellipse 55% 60% at 50% 78%,
      rgba(255, 205, 145, 0.22) 0%,
      rgba(255, 200, 150, 0.16) 18%,
      rgba(255, 195, 155, 0.11) 34%,
      rgba(255, 190, 160, 0.07) 50%,
      rgba(255, 185, 165, 0.035) 66%,
      rgba(255, 180, 170, 0.015) 82%,
      rgba(255, 180, 170, 0)   100%
    );
    filter: blur(26px);
    pointer-events: none;
    z-index: -1;
    animation: glow-breathe 7s ease-in-out infinite;
  }
  @keyframes glow-breathe {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1;    }
  }

  /* ═══════════════════════════════════════════════════════════
     LEFT STACK — anchored above the boy's head, centered
     ═══════════════════════════════════════════════════════════ */
  .left-stack {
    position: absolute;
    left: 50%;
    bottom: 100%;                /* sits above the boy's head */
    transform: translateX(-50%); /* centered horizontally */
    margin-bottom: 14px;         /* small gap above the head */
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;         /* center both children */
    gap: 12px;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ───────── Equalizer (top of the stack) ───────── */
  .eq {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    background: rgba(22, 18, 30, 0.9);
    border: 1px solid rgba(255, 200, 140, 0.28);
    pointer-events: none;
  }
  .eq-label { font-size: 15px; font-weight: 500; color: #ffb98a; line-height: 1; }
  #equalizer { display: block; width: 110px; height: 24px; }

  /* ───────── Socials (below the equalizer, above head) ───────── */
  .socials {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    letter-spacing: 0.06em;
    pointer-events: auto;
  }
  .social {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 5px 12px 5px 8px; border-radius: 999px;
    background: rgba(22, 18, 30, 0.9);
    border: 1px solid rgba(255, 200, 140, 0.22);
    color: #f3ead4; text-decoration: none; font-family: inherit;
    font-size: 14px; line-height: 1; white-space: nowrap;
    transition: color .2s ease, border-color .2s ease, transform .2s ease;
  }
  .social:hover { color: #ffb98a; border-color: rgba(255, 185, 138, 0.6); transform: translateY(-2px); }
  .social-icon { display: inline-flex; width: 16px; height: 16px; flex-shrink: 0; color: inherit; }
  .social-icon svg { width: 100%; height: 100%; display: block; }

  /* ───────── Signature ───────── */
  .signature {
    position: absolute;
    left: 92%;
    bottom: 4%;
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    animation: sig-appear 2s ease-out 1.4s forwards;
  }
  .signature-text {
    display: inline-block;
    font-family: 'Dancing Script', 'Great Vibes', cursive;
    font-weight: 500;
    font-size: clamp(22px, 2.6vw, 38px);
    line-height: 1;
    color: rgba(243, 234, 212, 0.82);
    letter-spacing: 0.01em;
    text-shadow:
      0 0 8px rgba(255, 200, 140, 0.35),
      0 0 16px rgba(255, 200, 140, 0.15);
    clip-path: inset(0 100% 0 0);
    animation: write-in 3.4s cubic-bezier(0.6, 0, 0.4, 1) 1.6s forwards;
    padding: 0 4px 4px 2px;
    -webkit-font-smoothing: antialiased;
  }
  @keyframes sig-appear {
    from { opacity: 0; filter: blur(5px); transform: translateX(4px); }
    to   { opacity: 1; filter: blur(0);   transform: translateX(0);   }
  }
  @keyframes write-in {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 -10% 0 0); }
  }

  /* ───────── Girl ───────── */
  .girl-wrap {
    position: absolute;
    left: 30%; bottom: 0;
    height: 70vh;
    margin-right: 20px;
    z-index: 2;
    pointer-events: none;
    transform-origin: 50% 100%;
    will-change: transform;
    animation: alive-girl 8.5s ease-in-out infinite;
  }
  .girl {
    height: 100%; width: auto; display: block;
    object-fit: contain; user-select: none;
  }
  @keyframes alive-girl {
    0%, 100% { transform: translateY(0)    rotate(0deg)    scale(1); }
    30%      { transform: translateY(-5px) rotate(0.55deg) scale(1.005, 1.012); }
    60%      { transform: translateY(-8px) rotate(0deg)    scale(1.008, 1.018); }
  }
  .girl-wrap::before {
    content: "";
    position: absolute;
    inset: -30% -45% -22% -45%;
    background: radial-gradient(
      ellipse 55% 60% at 50% 78%,
      rgba(255, 205, 145, 0.22) 0%,
      rgba(255, 200, 150, 0.16) 18%,
      rgba(255, 195, 155, 0.11) 34%,
      rgba(255, 190, 160, 0.07) 50%,
      rgba(255, 185, 165, 0.035) 66%,
      rgba(255, 180, 170, 0.015) 82%,
      rgba(255, 180, 170, 0)   100%
    );
    filter: blur(26px);
    pointer-events: none;
    z-index: -1;
    animation: glow-breathe 9s ease-in-out infinite reverse;
  }

  /* ───────── Tree ───────── */
  .roof-wrap {
    position: absolute;
    right: 0; top: 0;
    height: 60vh;
    z-index: 2;
    pointer-events: none;
    contain: layout style;
  }
  .roof {
    display: block;
    height: 100%; width: auto;
    object-fit: contain;
    user-select: none;
  }
  .roof-wrap::before {
    content: "";
    position: absolute;
    inset: -25% -35% -15% -35%;
    background: radial-gradient(
      ellipse 55% 60% at 55% 35%,
      rgba(255, 210, 150, 0.18) 0%,
      rgba(255, 205, 155, 0.13) 20%,
      rgba(255, 200, 160, 0.09) 38%,
      rgba(255, 195, 165, 0.055) 55%,
      rgba(255, 190, 170, 0.028) 72%,
      rgba(255, 185, 175, 0.010) 86%,
      rgba(255, 185, 175, 0)    100%
    );
    filter: blur(30px);
    pointer-events: none;
    z-index: -1;
    animation: tree-glow 11s ease-in-out infinite;
  }
  @keyframes tree-glow {
    0%, 100% { opacity: 0.55; }
    45%      { opacity: 0.9; }
    70%      { opacity: 0.7; }
  }

  .block {
    height: 100%; position: absolute; width: 50%; right: 0; z-index: 2;
    display: flex; flex-direction: row; justify-content: flex-end; align-items: flex-end;
    pointer-events: none;
  }

  /* ───────── Haiku ───────── */
  .haiku {
    position: absolute; top: 5dvh; left: 80px;
    writing-mode: vertical-rl; text-orientation: mixed;
    font-size: 32px; line-height: 2.2;
    color: #f3ead4;
    letter-spacing: 0.08em;
    text-shadow: 0 0 12px rgba(255, 200, 140, 0.5);
    font-weight: 500; user-select: none;
    z-index: 4;
  }

  /* ───────── Now-playing pill ───────── */
  .yt-wrap {
    position: absolute; top: calc(5dvh + 270px); left: 80px; z-index: 4;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 0 16px; height: 40px; border-radius: 999px;
    background: rgba(22, 18, 30, 0.9);
    border: 1px solid rgba(255, 200, 140, 0.28);
    font-size: 13px; font-weight: 500; color: #f3ead4;
    letter-spacing: 0.04em; user-select: none; pointer-events: none; white-space: nowrap;
  }
  .yt-icon { display: inline-flex; width: 16px; height: 16px; color: #ffb98a; flex-shrink: 0; }
  .yt-icon svg { width: 100%; height: 100%; display: block; }
  .yt-text.error { color: #ff9d9d; }

  .yt-hidden {
    position: fixed;
    top: 0; left: 0;
    width: 200px; height: 120px;
    opacity: 0.01;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
    display: none;
  }
  .yt-hidden.active { display: block; }
  #yt-player { width: 100%; height: 100%; }

  /* ───────── Responsive ───────── */
  @media (max-width: 900px) {
    .haiku { font-size: 24px; line-height: 2; left: 44px; }
    .yt-wrap { top: calc(5dvh + 205px); left: 44px; height: 34px; padding: 0 13px; font-size: 12px; gap: 7px; }
    .yt-icon { width: 14px; height: 14px; }
    .person-wrap { height: 44vh; }
    .girl-wrap   { height: 60vh; }
    .roof-wrap   { height: 52vh; }
    .left-stack { margin-bottom: 12px; gap: 10px; }
    .eq { height: 38px; padding: 0 13px; gap: 8px; }
    .eq-label { font-size: 13px; }
    #equalizer { width: 90px; height: 20px; }
    .socials { gap: 6px; }
    .social  { font-size: 12px; padding: 4px 10px 4px 7px; gap: 6px; }
    .social-icon { width: 14px; height: 14px; }
    .person-wrap::before, .girl-wrap::before { filter: blur(20px); }
    .roof-wrap::before { filter: blur(22px); }
    .signature-text { font-size: clamp(20px, 3.2vw, 32px); }
  }

  @media (max-width: 700px) {
    .haiku { font-size: 18px; line-height: 1.9; top: 3dvh; left: 14px; }
    .yt-wrap { top: calc(3dvh + 150px); left: 14px; height: 28px; padding: 0 11px; font-size: 10px; gap: 6px; }
    .yt-icon { width: 12px; height: 12px; }
    .person-wrap { height: 32vh; right: 45%; }
    .girl-wrap   { height: 44vh; left: 30%; margin-right: 0; }
    .roof-wrap   { height: 22vh; }
    .left-stack { margin-bottom: 10px; gap: 8px; }
    .eq { height: 30px; padding: 0 10px; gap: 6px; }
    .eq-label { font-size: 10px; }
    #equalizer { width: 60px; height: 14px; }
    .socials { gap: 4px; }
    .social { font-size: 9px; padding: 3px 8px 3px 5px; gap: 4px; }
    .social-icon { width: 11px; height: 11px; }
    .person-wrap::before, .girl-wrap::before { filter: blur(16px); }
    .roof-wrap::before { filter: blur(18px); }
    .signature { bottom: 3%; }
    .signature-text { font-size: clamp(18px, 4.5vw, 26px); }
  }

  @media (max-width: 400px) {
    .haiku { font-size: 16px; }
    .person-wrap { height: 30vh; }
    .girl-wrap   { height: 40vh; }
    .roof-wrap   { height: 20vh; }
    .yt-wrap { font-size: 9px; padding: 0 9px; height: 24px; }
    .left-stack { margin-bottom: 8px; gap: 6px; }
    .eq { height: 26px; padding: 0 8px; }
    #equalizer { width: 52px; height: 12px; }
    .social { font-size: 8px; padding: 3px 6px 3px 4px; }
    .social-icon { width: 10px; height: 10px; }
    .signature-text { font-size: 16px; }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .haiku { font-size: 16px; line-height: 1.7; top: 8px; left: 14px; }
    .yt-wrap { top: calc(8px + 130px); left: 14px; }
    .person-wrap { height: 72vh; }
    .girl-wrap   { height: 88vh; }
    .roof-wrap   { height: 70vh; }
    .left-stack { margin-bottom: 10px; gap: 8px; }
    .eq { height: 30px; padding: 0 10px; }
    #equalizer { width: 60px; height: 14px; }
    .socials { gap: 4px; }
    .social { font-size: 9px; padding: 3px 7px 3px 5px; gap: 4px; }
    .social-icon { width: 11px; height: 11px; }
    .signature-text { font-size: clamp(18px, 2.6vw, 24px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .person-wrap, .girl-wrap { animation: none; }
    .person-wrap::before, .girl-wrap::before,
    .roof-wrap::before { animation: none; opacity: 0.8; }
    .signature, .signature-text { animation: none; opacity: 1; filter: none; clip-path: none; }
  }
</style>
</head>
<body>

<div class="haiku" lang="jp">
  花は散り<br>
  名を覚えている<br>
  風ばかり
</div>

<div class="yt-wrap">

    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

    <div class="socials" aria-label="social links">

        <span class="social-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5 3.3 9.3 7.8 10.8.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.8 2.7 1.3 3.4 1 .1-.7.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.5 11.5 0 0 0 23.5 12C23.5 5.7 18.3.5 12 .5Z"/></svg></span>

         alt="girl">

  <div class="roof-wrap">

<script>
const IS_MOBILE =
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
  window.innerWidth < 700;

function killScroll(e) { if (e.cancelable) e.preventDefault(); }
document.addEventListener("touchmove", killScroll, { passive: false });
document.addEventListener("wheel", killScroll, { passive: false });
document.addEventListener("gesturestart", killScroll, { passive: false });
window.addEventListener("scroll", () => { window.scrollTo(0, 0); }, { passive: true });

function downscaleImg(imgEl, maxW, maxH) {
  const doIt = () => {
    try {
      const iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
      if (!iw || !ih) return;
      const scale = Math.min(maxW / iw, maxH / ih, 1);
      if (scale >= 1) return;
      const w = Math.max(1, Math.round(iw * scale));
      const h = Math.max(1, Math.round(ih * scale));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const cx = c.getContext("2d");
      cx.imageSmoothingEnabled = true;
      cx.imageSmoothingQuality = "high";
      cx.drawImage(imgEl, 0, 0, w, h);
      imgEl.src = c.toDataURL("image/png");
    } catch (e) {}
  };
  if (imgEl.complete && imgEl.naturalWidth) doIt();
  else imgEl.addEventListener("load", doIt, { once: true });
}

(function preloadAndDownscale() {
  const capDesktop = { p: 900,  g: 1200, r: 1000 };
  const capMobile  = { p: 500,  g: 650,  r: 550  };
  const cap = IS_MOBILE ? capMobile : capDesktop;
  downscaleImg(document.getElementById("personImg"), cap.p, cap.p);
  downscaleImg(document.getElementById("girlImg"),   cap.g, cap.g);
  downscaleImg(document.getElementById("roofImg"),   cap.r, cap.r);
})();

const AUDIO_SOURCE = IS_MOBILE ? "mp3" : "auto";
const YT_VIDEO_ID     = "arpYrtPAmMw";
const YT_START_SEC    = 47;
const YT_WATCHDOG_MS  = 8000;
const FADE_SECONDS    = 5;
const MP3_TRACKS = [
  "https://cdn.jsdelivr.net/gh/pratrx-web/its_pratrx@main/videos/dido.mp3"
];

const audioState = { bass: 0, mid: 0, treble: 0, beat: 0, active: false };
let currentSource = null;
let volumeFadeInterval = null;

const ytLabel = document.getElementById("ytLabel");
function setLabel(text, isError) {
  ytLabel.textContent = text;
  ytLabel.classList.toggle("error", !!isError);
}

function fadeVolume(setVol, onDone) {
  if (volumeFadeInterval) clearInterval(volumeFadeInterval);
  const steps = FADE_SECONDS * 10;
  const stepMs = (FADE_SECONDS * 1000) / steps;
  let step = 0;
  setVol(0);
  setLabel("fading in…");
  volumeFadeInterval = setInterval(() => {
    step++;
    setVol(Math.min(100, Math.round((step / steps) * 100)));
    if (step >= steps) {
      clearInterval(volumeFadeInterval);
      volumeFadeInterval = null;
      setLabel("now playing");
      if (onDone) onDone();
    }
  }, stepMs);
}

const eqCanvas = document.getElementById("equalizer");
const eqCtx = eqCanvas.getContext("2d");
const BAR_COUNT = IS_MOBILE ? 12 : 22;

function sizeEqCanvas() {
  const r = eqCanvas.getBoundingClientRect();
  eqCanvas.width  = Math.max(1, Math.floor(r.width));
  eqCanvas.height = Math.max(1, Math.floor(r.height));
}
sizeEqCanvas();
window.addEventListener("resize", sizeEqCanvas);
window.addEventListener("orientationchange", () => setTimeout(sizeEqCanvas, 150));

let eqTick = 0;
let paused = false;

function drawEq(t) {
  const W = eqCanvas.width, H = eqCanvas.height;
  eqCtx.clearRect(0, 0, W, H);
  const barW = (W / BAR_COUNT) * 0.7;
  const gap  = (W - barW * BAR_COUNT) / (BAR_COUNT - 1);
  for (let i = 0; i < BAR_COUNT; i++) {
    let v;
    if (audioState.active) {
      const pos = i / BAR_COUNT;
      const bs = Math.max(0, 1 - pos * 2) * audioState.bass;
      const ms = Math.max(0, 1 - Math.abs(pos - 0.5) * 2.5) * audioState.mid;
      const ts = Math.max(0, pos * 1.5 - 0.5) * audioState.treble;
      v = Math.min(1, bs + ms + ts);
    } else {
      const phase = t * 0.002 + i * 0.35;
      v = (Math.sin(phase) * 0.5 + 0.5) * 0.7 + 0.15;
    }
    const h = v * H;
    const x = i * (barW + gap);
    eqCtx.fillStyle = `rgba(255, 190, 155, ${0.35 + v * 0.6})`;
    eqCtx.fillRect(x, H - h, barW, h);
  }
}
function eqLoop(t) {
  eqTick++;
  if (!paused && (!IS_MOBILE || (eqTick % 3 === 0))) drawEq(t);
  requestAnimationFrame(eqLoop);
}
requestAnimationFrame(eqLoop);

document.addEventListener("visibilitychange", () => { paused = document.hidden; });

let ytPlayer = null;
let ytPlayerState = -1;
let ytUnmuted = false;
let ytWatchdog = null;

function loadYouTubeAPI(cb) {
  if (window.YT && window.YT.Player) { cb(); return; }
  window.onYouTubeIframeAPIReady = cb;
  if (!document.querySelector('script[data-yt-api]')) {
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.async = true;
    s.setAttribute("data-yt-api", "1");
    document.head.appendChild(s);
  }
}

function forceLowQuality() {
  if (!ytPlayer || typeof ytPlayer.setPlaybackQuality !== "function") return;
  try {
    ytPlayer.setPlaybackQuality("tiny");
    if (typeof ytPlayer.setPlaybackQualityRange === "function") {
      ytPlayer.setPlaybackQualityRange("tiny", "tiny");
    }
  } catch (_) {}
}

function startYouTube() {
  currentSource = "youtube";
  setLabel("loading…");
  document.getElementById("ytShell").classList.add("active");
  loadYouTubeAPI(initYT);
  ytWatchdog = setTimeout(() => {
    if (ytPlayerState !== 1 && AUDIO_SOURCE === "auto") switchToMP3("watchdog");
  }, YT_WATCHDOG_MS);
}

function initYT() {
  if (ytPlayer) return;
  ytPlayer = new YT.Player("yt-player", {
    height: "100%", width: "100%",
    videoId: YT_VIDEO_ID,
    playerVars: {
      autoplay: 1, mute: 1, controls: 0,
      modestbranding: 1, rel: 0, playsinline: 1,
      vq: "tiny", start: YT_START_SEC,
      origin: window.location.origin
    },
    events: {
      onReady: (e) => {
        forceLowQuality();
        try { e.target.seekTo(YT_START_SEC, true); } catch (_) {}
        try { e.target.playVideo(); } catch (_) {}
        setTimeout(() => { if (!ytUnmuted) tryYtUnmute(); }, 350);
      },
      onStateChange: (e) => {
        ytPlayerState = e.data;
        if (e.data === 1) {
          audioState.active = true;
          if (ytWatchdog) { clearTimeout(ytWatchdog); ytWatchdog = null; }
          forceLowQuality();
          setTimeout(forceLowQuality, 800);
          if (!ytUnmuted) tryYtUnmute();
        } else if (e.data === 2) setLabel("paused");
        else if (e.data === 3) setLabel("buffering…");
      },
      onError: (e) => {
        if (AUDIO_SOURCE === "auto") switchToMP3("yt-error-" + e.data);
        else setLabel("yt error " + e.data, true);
      }
    }
  });
}

function tryYtUnmute() {
  if (!ytPlayer || ytUnmuted) return;
  try {
    ytPlayer.unMute();
    ytPlayer.setVolume(0);
    ytUnmuted = true;
    fadeVolume(v => { try { ytPlayer.setVolume(v); } catch (_) {} });
  } catch (e) {}
}

function destroyYT() {
  if (ytWatchdog) { clearTimeout(ytWatchdog); ytWatchdog = null; }
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    try { ytPlayer.destroy(); } catch (_) {}
  }
  ytPlayer = null;
  ytPlayerState = -1;
  ytUnmuted = false;
  document.getElementById("ytShell").classList.remove("active");
}

let lastSimBeat = 0;
function ytSimLoop() {
  if (currentSource === "youtube" && audioState.active && ytPlayerState === 1) {
    const t = performance.now();
    const bassEnv = 0.4 + Math.sin(t * 0.0015) * 0.25;
    if (t - lastSimBeat > 480) { audioState.beat = 0.7 + Math.random() * 0.3; lastSimBeat = t; }
    audioState.bass   = bassEnv + audioState.beat * 0.35;
    audioState.mid    = 0.35 + Math.sin(t * 0.004) * 0.15 + Math.random() * 0.05;
    audioState.treble = 0.25 + Math.random() * 0.2;
    audioState.beat  *= 0.9;
  } else if (currentSource === "youtube") {
    audioState.bass *= 0.95; audioState.mid *= 0.95;
    audioState.beat *= 0.9;  audioState.treble *= 0.95;
  }
  requestAnimationFrame(ytSimLoop);
}
requestAnimationFrame(ytSimLoop);

let audioEl = null;
let audioCtx = null;
let analyser = null;
let dataArr = null;
let analyserRunning = false;
let mp3Unmuted = false;
let beatCooldown = 0;
let prevBass = 0;

function switchToMP3(reason) {
  console.log("→ MP3 source:", reason);
  destroyYT();
  currentSource = "mp3";
  audioState.active = false;
  setLabel("loading…");
  audioEl = new Audio();
  audioEl.crossOrigin = "anonymous";
  audioEl.loop = true;
  audioEl.preload = "auto";
  audioEl.src = MP3_TRACKS[0];
  audioEl.muted = true;
  audioEl.volume = 1;
  audioEl.addEventListener("canplaythrough", onMp3Ready, { once: true });
  audioEl.addEventListener("error", () => setLabel("mp3 failed", true));
  audioEl.load();
}

function onMp3Ready() {
  audioEl.play().then(() => {
    audioState.active = true;
    setupMp3Analyser();
    setLabel("tap for sound");
    setTimeout(unmuteMp3, 250);
    setTimeout(unmuteMp3, 800);
    setTimeout(unmuteMp3, 1500);
  }).catch(() => setLabel("tap to play", true));
}

function setupMp3Analyser() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.75;
    dataArr = new Uint8Array(analyser.frequencyBinCount);
    const src = audioCtx.createMediaElementSource(audioEl);
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    if (audioCtx.state === "suspended") audioCtx.resume();
    analyserRunning = true;
    analyserTick();
  } catch (e) { console.warn("Analyser setup failed:", e); }
}

function analyserTick() {
  if (!analyserRunning) return;
  requestAnimationFrame(analyserTick);
  if (!analyser || paused) return;
  analyser.getByteFrequencyData(dataArr);
  const bassEnd = 3, midEnd = 9;
  let bSum = 0, mSum = 0, tSum = 0;
  for (let i = 0; i < bassEnd; i++) bSum += dataArr[i];
  for (let i = bassEnd; i < midEnd; i++) mSum += dataArr[i];
  for (let i = midEnd; i < dataArr.length; i++) tSum += dataArr[i];
  const b = bSum / (bassEnd * 255);
  const m = mSum / ((midEnd - bassEnd) * 255);
  const t = tSum / ((dataArr.length - midEnd) * 255);
  const smooth = (p, n) => p + (n - p) * (n > p ? 0.4 : 0.1);
  audioState.bass   = smooth(audioState.bass, b);
  audioState.mid    = smooth(audioState.mid, m);
  audioState.treble = smooth(audioState.treble, t);
  if (beatCooldown > 0) beatCooldown--;
  const delta = b - prevBass;
  if (b > 0.32 && delta > 0.13 && beatCooldown <= 0) {
    audioState.beat = Math.min(1, b * 1.3);
    beatCooldown = 6;
  }
  prevBass = b;
  audioState.beat *= 0.90;
  if (audioState.beat < 0.005) audioState.beat = 0;
}

function unmuteMp3() {
  if (!audioEl || mp3Unmuted) return;
  try {
    audioEl.muted = false;
    audioEl.volume = 0;
    mp3Unmuted = true;
    fadeVolume(v => { audioEl.volume = v / 100; });
  } catch (e) {}
}

if (AUDIO_SOURCE === "mp3") switchToMP3("mobile-default");
else startYouTube();

function onAnyInteraction() {
  if (currentSource === "mp3" && !mp3Unmuted) unmuteMp3();
  else if (currentSource === "youtube" && !ytUnmuted) tryYtUnmute();
}
["pointerdown", "keydown", "touchstart", "click", "scroll"].forEach(evt =>
  window.addEventListener(evt, onAnyInteraction, { passive: true })
);
</script>
</body>
</html>
