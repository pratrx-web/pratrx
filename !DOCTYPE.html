<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  body { margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 78% 22%, rgba(255, 200, 140, 0.10), transparent 45%),
      radial-gradient(circle at 20% 80%, rgba(255, 150, 160, 0.06), transparent 50%);

  .person {
    position: absolute; right: 45%; bottom: 0; height: 50vh;
    object-fit: contain; z-index: 1; user-select: none;
    filter: drop-shadow(0 0 24px rgba(255, 200, 140, 0.18)) brightness(0.92) saturate(0.9);

  .block {
    height: 100%; position: absolute; width: 50%; right: 0; z-index: 1;
    display: flex; flex-direction: row; justify-content: flex-end; align-items: flex-end;
  }

  .roof {
    display: block; align-self: flex-start; height: 60vh; width: auto;
    object-fit: contain; user-select: none;
    filter: brightness(0.75) saturate(0.85) drop-shadow(0 0 30px rgba(255, 180, 130, 0.15));

  .girl {
    position: absolute; left: 30%; display: block; height: 70vh; width: auto;
    object-fit: contain; margin-right: 20px; user-select: none;
    filter: drop-shadow(0 0 22px rgba(255, 200, 140, 0.18)) brightness(0.92) saturate(0.9);
  }

  .haiku {
    position: absolute; top: 5dvh; left: 80px;
    writing-mode: vertical-rl; text-orientation: mixed;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: 32px; line-height: 2.2; color: #f3ead4;
    letter-spacing: 0.08em;
    filter: drop-shadow(0 0 12px rgba(255, 200, 140, 0.45)) drop-shadow(0 0 2px rgba(255, 200, 140, 0.6));
    font-weight: 500; user-select: none;
  }

  #scene { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: -1; }

  .eq {
    position: absolute; top: calc(5dvh + 270px); left: 80px; z-index: 3;
    display: inline-flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 16px; border-radius: 999px;
    background: rgba(22, 18, 30, 0.82);
    border: 1px solid rgba(255, 200, 140, 0.28);
    box-shadow: 0 0 24px rgba(255, 180, 120, 0.14), inset 0 0 12px rgba(255, 200, 140, 0.06);
    user-select: none; pointer-events: none;
  }
  .eq-label {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: 15px; font-weight: 500; color: #ffb98a; line-height: 1;
    text-shadow: 0 0 10px rgba(255, 180, 120, 0.6);
  }
  #equalizer { display: block; width: 110px; height: 24px; }

  .yt-wrap {
    position: absolute; top: calc(5dvh + 324px); left: 80px; z-index: 4;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 0 16px; height: 40px; border-radius: 999px;
    background: rgba(22, 18, 30, 0.82);
    border: 1px solid rgba(255, 200, 140, 0.28);

    letter-spacing: 0.04em; user-select: none; pointer-events: none; white-space: nowrap;

  .yt-icon {

  .socials {
    position: absolute; right: calc(45% + 28vh); bottom: 18vh; z-index: 3;

    width: 1px;

  .social {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 6px 13px 6px 9px; border-radius: 999px;
    background: rgba(22, 18, 30, 0.82);
    border: 1px solid rgba(255, 200, 140, 0.22);

    font-size: 15px; line-height: 1;

    transition: color .22s ease, border-color .22s ease, background .22s ease,
                transform .22s ease, box-shadow .22s ease;
    white-space: nowrap;

  .social:hover {
    color: #ffb98a;

    background: rgba(30, 24, 42, 0.95);
    transform: translateX(-4px);
    box-shadow: 0 0 28px rgba(255, 180, 120, 0.28);
  }
  .social-icon { display: inline-flex; width: 18px; height: 18px; flex-shrink: 0; color: inherit; }
  .social-icon svg { width: 100%; height: 100%; display: block; }

  @media (max-width: 900px) {

    .eq { top: calc(5dvh + 205px); left: 44px; height: 38px; padding: 0 13px; gap: 8px; }
    .eq-label { font-size: 13px; }

    .yt-wrap { top: calc(5dvh + 253px); left: 44px; height: 34px; padding: 0 13px; font-size: 12px; gap: 7px; }
    .yt-icon { width: 14px; height: 14px; }
    .person { height: 44vh; }
    .girl   { height: 60vh; }
    .roof   { height: 52vh; }
    .socials { right: calc(45% + 24vh); bottom: 16vh; gap: 8px; }
    .social  { font-size: 13px; padding: 5px 11px 5px 8px; gap: 7px; }
    .social-icon { width: 15px; height: 15px; }
  }

  @media (max-width: 700px) {
    .haiku { font-size: 18px; line-height: 1.9; letter-spacing: 0.05em; top: 3dvh; left: 14px; }
    .eq { top: calc(3dvh + 150px); left: 14px; height: 32px; padding: 0 10px; gap: 6px; }
    .eq-label { font-size: 11px; }
    #equalizer { width: 70px; height: 16px; }
    .yt-wrap { top: calc(3dvh + 190px); left: 14px; height: 28px; padding: 0 11px; font-size: 10px; gap: 6px; }
    .yt-icon { width: 12px; height: 12px; }
    .person { height: 32vh; right: 45%; }
    .girl   { height: 44vh; left: 30%; }
    .roof   { height: 22vh; }
    .socials { right: auto; left: 12px; bottom: 12px; align-items: flex-start; gap: 5px; }
    .socials::after { display: none; }
    .social { font-size: 10px; padding: 4px 8px 4px 6px; gap: 4px; }
    .social-icon { width: 12px; height: 12px; }
  }

  @media (max-width: 400px) {
    .haiku { font-size: 16px; }
    .person { height: 30vh; }
    .girl   { height: 40vh; }
    .roof   { height: 20vh; }
    #equalizer { width: 60px; height: 14px; }
    .yt-wrap { font-size: 9px; padding: 0 9px; height: 24px; }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .haiku { font-size: 16px; line-height: 1.7; top: 8px; left: 14px; }
    .eq    { top: calc(8px + 130px); left: 14px; }
    .yt-wrap { top: calc(8px + 166px); left: 14px; }
    .person { height: 72vh; }
    .girl   { height: 88vh; }
    .roof   { height: 70vh; }
    .socials { right: auto; left: 14px; bottom: 8px; align-items: flex-start; gap: 5px; }
    .socials::after { display: none; }
    .social { font-size: 10px; padding: 3px 8px 3px 6px; gap: 4px; }
    .social-icon { width: 12px; height: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .social { transition: none; }
  }
</style>

<script>
/* ============================================================
   🎵 AUDIO CONFIG
   ============================================================ */
const AUDIO_SOURCE = "auto";

const YT_VIDEO_ID     = "arpYrtPAmMw";
const YT_START_SEC    = 40;            /* ← starts at 40s */
const YT_WATCHDOG_MS  = 8000;
const FADE_SECONDS    = 5;

const MP3_TRACKS = [
  "https://cdn.jsdelivr.net/gh/pratrx-web/its_pratrx@main/videos/dido.mp3"
];


/* ============================================================
   SHARED AUDIO STATE
   ============================================================ */
const audioState = { bass: 0, mid: 0, treble: 0, beat: 0, active: false };
let currentSource = null;
let volumeFadeInterval = null;

const ytLabel = document.getElementById("ytLabel");
function setLabel(text, isError) {
  ytLabel.textContent = text;
  ytLabel.classList.toggle("error", !!isError);
}

function fadeVolume(setVol, onDone) {
  if (volumeFadeInterval) clearInterval(volumeFadeInterval);
  const steps = FADE_SECONDS * 10;
  const stepMs = (FADE_SECONDS * 1000) / steps;
  let step = 0;
  setVol(0);
  setLabel("fading in…");
  volumeFadeInterval = setInterval(() => {
    step++;
    setVol(Math.min(100, Math.round((step / steps) * 100)));
    if (step >= steps) {
      clearInterval(volumeFadeInterval);
      volumeFadeInterval = null;
      setLabel("now playing");
      if (onDone) onDone();
    }
  }, stepMs);
}


/* ============================================================
   PARTICLE SYSTEM
   ============================================================ */
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
let width = 0, height = 0, particles = [];

const settings = {
  bgColor: "#0d0b18",
  minWind: 1, maxWind: 10,
  minSize: 14, maxSize: 38,
  emitterY: 0.15, emitterSpread: 0.85,
  gravity: 0.6, turbulence: 0.8,
  rotationSpeed: 0, tumbleStrength: 0.4, staticTilt: 0,
  particleCount: 150, direction: -1
};
const cache = { minSize: 0, maxSize: 0, minWind: 0, maxWind: 0, tiltRad: 0 };

function updateCache() {
  cache.minSize = Math.min(settings.minSize, settings.maxSize);
  cache.maxSize = Math.max(settings.minSize, settings.maxSize);
  cache.minWind = Math.min(settings.minWind, settings.maxWind);
  cache.maxWind = Math.max(settings.minWind, settings.maxWind);
  cache.tiltRad = (settings.staticTilt * Math.PI) / 180;
}

function createDefaultImage() {
  const c = document.createElement("canvas");
  c.width = 128; c.height = 128;
  const t = c.getContext("2d");
  t.shadowColor = "rgba(255, 200, 210, 0.9)";
  t.shadowBlur = 22;
  t.scale(2, 2);
  t.beginPath();
  t.moveTo(32, 5);
  t.quadraticCurveTo(5, 32, 32, 59);
  t.quadraticCurveTo(59, 32, 32, 5);
  const grad = t.createLinearGradient(32, 5, 32, 59);
  grad.addColorStop(0, "#ffe7d6");
  grad.addColorStop(0.5, "#ffb8b8");
  grad.addColorStop(1, "#e88fa8");
  t.fillStyle = grad; t.fill();
  t.strokeStyle = "rgba(255, 220, 220, 0.85)"; t.lineWidth = 1.6; t.stroke();
  t.beginPath(); t.moveTo(32, 5); t.lineTo(32, 59);
  t.strokeStyle = "rgba(255, 235, 220, 0.7)"; t.lineWidth = 1.2; t.stroke();
  const img = new Image();
  img.src = c.toDataURL();
  return img;
}
const particleImage = createDefaultImage();

function rotateVector(x, y, z, ax, ay, az) {
  let c = Math.cos(az), s = Math.sin(az);
  const x1 = x*c - y*s, y1 = x*s + y*c, z1 = z;
  c = Math.cos(ay); s = Math.sin(ay);
  const x2 = x1*c + z1*s, y2 = y1, z2 = -x1*s + z1*c;
  c = Math.cos(ax); s = Math.sin(ax);
  return { x: x2, y: y2*c - z2*s, z: y2*s + z2*c };
}

class Particle {
  constructor(init = false) {
    this.audioSens = 0.6 + Math.random() * 0.7;
    this.beatSens  = 0.7 + Math.random() * 0.6;
    this.gust = 1;
    this.twinkle = Math.random() * Math.PI * 2;
    this.twinkleSpeed = 0.0008 + Math.random() * 0.0012;
    this.reset(init);
  }
  reset(init = false) {
    this.image = particleImage;
    this.width = cache.minSize + Math.random() * (cache.maxSize - cache.minSize);
    this.height = this.width;
    const cy = height * settings.emitterY;
    const sh = height * settings.emitterSpread;
    const minY = cy - sh/2, maxY = cy + sh/2;
    this.y = minY + Math.random() * (maxY - minY);
    if (init) this.x = Math.random() * width;
    else this.x = settings.direction === -1
      ? width + this.width + Math.random() * width
      : -this.width - Math.random() * width;
    const sf = (this.width - cache.minSize) / (cache.maxSize - cache.minSize || 1);
    this.windFactor = Math.max(0.1, Math.min(1, 1 - (sf * 0.5 + Math.random() * 0.5)));
    this.vx = 0; this.vy = 0;
    this.waveOffset = Math.random() * Math.PI * 2;
    this.angleZ = Math.random() * Math.PI * 2;
    this.spinZ = (Math.random() - 0.5) * settings.rotationSpeed;
    this.angleX = 0; this.angleY = 0;
    this.spinX = (Math.random() - 0.5) * 0.1;
    this.spinY = (Math.random() - 0.5) * 0.1;
  }
  update() {
    const targetSpeed = cache.minWind + (cache.maxWind - cache.minWind) * this.windFactor;
    this.vx += (targetSpeed - this.vx) * 0.1;
    const gravityMod = 1.5 - this.windFactor;
    this.vy += settings.gravity * 0.05 * gravityMod;
    const wave = Math.sin(this.x * 0.01 * settings.direction + this.waveOffset);
    this.vy += wave * settings.turbulence * 0.05;
    this.vy *= 0.98;

    let targetGust = 1;
    if (audioState.active) {
      const s = this.audioSens;
      targetGust += audioState.bass * 0.9 * s;
      targetGust += audioState.mid  * 0.25 * s;
      targetGust += audioState.beat * 1.6 * this.beatSens;
    }
    this.gust += (targetGust - this.gust) * 0.25;

    this.x += this.vx * settings.direction * this.gust;
    this.y += this.vy * this.gust;
    this.angleZ += this.spinZ + this.vx * 0.002 * this.gust;
    if (settings.tumbleStrength > 0) {
      this.angleX += this.spinX * settings.tumbleStrength;
      this.angleY += this.spinY * settings.tumbleStrength;
    }
    this.twinkle += this.twinkleSpeed;

    const b = 200;
    const oX = settings.direction === -1 ? this.x < -b : this.x > width + b;
    if (oX || this.y > height + b || this.y < -b) this.reset(false);
  }
  draw() {
    const u = rotateVector(1,0,0, this.angleX, this.angleY + cache.tiltRad, this.angleZ);
    const v = rotateVector(0,1,0, this.angleX, this.angleY + cache.tiltRad, this.angleZ);
    const tw = 0.9 + Math.sin(this.twinkle) * 0.18;
    ctx.save();
    ctx.shadowColor = "rgba(255, 180, 190, 0.55)";
    ctx.shadowBlur = 18 * tw;
    ctx.globalAlpha = Math.min(1, 0.85 + tw * 0.15);
    ctx.translate(this.x, this.y);
    ctx.transform(u.x, u.y, v.x, v.y, 0, 0);
    ctx.drawImage(this.image, -this.width/2, -this.height/2, this.width, this.height);
    ctx.restore();
  }
}

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
}
function initParticles() {
  particles = [];
  for (let i = 0; i < settings.particleCount; i++) {
    const p = new Particle(false);
    p.x += Math.random() * width * 1.5;
    particles.push(p);
  }
}
function animate() {
  ctx.fillStyle = settings.bgColor;
  ctx.fillRect(0, 0, width, height);

  const haze = ctx.createRadialGradient(
    width * 0.78, height * 0.22, 0,
    width * 0.78, height * 0.22, Math.max(width, height) * 0.7
  );
  haze.addColorStop(0, "rgba(255, 200, 150, 0.10)");
  haze.addColorStop(0.4, "rgba(255, 180, 160, 0.05)");
  haze.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = haze;
  ctx.fillRect(0, 0, width, height);

  for (const p of particles) { p.update(); p.draw(); }
  requestAnimationFrame(animate);
}
function startScene() {
  updateCache(); resize(); initParticles(); animate();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));
}
startScene();


/* ============================================================
   EQUALIZER
   ============================================================ */
const eqCanvas = document.getElementById("equalizer");
const eqCtx = eqCanvas.getContext("2d");
const BAR_COUNT = 24;

function sizeEqCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = eqCanvas.getBoundingClientRect();
  eqCanvas.width  = r.width  * dpr;
  eqCanvas.height = r.height * dpr;
}
sizeEqCanvas();
window.addEventListener("resize", sizeEqCanvas);

function drawEq(t) {
  const W = eqCanvas.width, H = eqCanvas.height;
  eqCtx.clearRect(0, 0, W, H);

  const barW = (W / BAR_COUNT) * 0.7;
  const gap  = (W - barW * BAR_COUNT) / (BAR_COUNT - 1);

  for (let i = 0; i < BAR_COUNT; i++) {
    let v;
    if (audioState.active) {
      const pos = i / BAR_COUNT;
      const bassShape   = Math.max(0, 1 - pos * 2) * audioState.bass;
      const midShape    = Math.max(0, 1 - Math.abs(pos - 0.5) * 2.5) * audioState.mid;
      const trebleShape = Math.max(0, pos * 1.5 - 0.5) * audioState.treble;
      v = Math.min(1, bassShape + midShape + trebleShape + Math.random() * 0.08);
    } else {
      const phase = t * 0.002 + i * 0.35;
      v = (Math.sin(phase) * 0.5 + 0.5) * 0.7 + 0.15;
    }
    const h = v * H;
    const x = i * (barW + gap);
    const grad = eqCtx.createLinearGradient(0, H - h, 0, H);
    grad.addColorStop(0, `rgba(255, 220, 170, ${0.4 + v * 0.6})`);
    grad.addColorStop(1, `rgba(255, 150, 140, ${0.3 + v * 0.7})`);
    eqCtx.fillStyle = grad;
    eqCtx.fillRect(x, H - h, barW, h);
  }
}
function eqLoop(t) { drawEq(t); requestAnimationFrame(eqLoop); }
requestAnimationFrame(eqLoop);


/* ============================================================
   YOUTUBE CONTROLLER
   ============================================================ */
let ytPlayer = null;
let ytPlayerState = -1;
let ytUnmuted = false;
let ytWatchdog = null;

function forceLowQuality() {
  if (!ytPlayer || typeof ytPlayer.setPlaybackQuality !== "function") return;
  try {
    ytPlayer.setPlaybackQuality("tiny");
    if (typeof ytPlayer.setPlaybackQualityRange === "function") {
      ytPlayer.setPlaybackQualityRange("tiny", "tiny");
    }
  } catch (_) {}
}

function startYouTube() {
  currentSource = "youtube";
  setLabel("loading…");

  if (window.YT && window.YT.Player) initYT();
  else window.onYouTubeIframeAPIReady = initYT;

  ytWatchdog = setTimeout(() => {
    if (ytPlayerState !== 1 && AUDIO_SOURCE === "auto") {
      console.warn("YouTube watchdog tripped — falling back to MP3");
      switchToMP3("watchdog");
    }
  }, YT_WATCHDOG_MS);
}

function initYT() {
  if (ytPlayer) return;
  ytPlayer = new YT.Player("yt-player", {
    height: "100%", width: "100%",
    videoId: YT_VIDEO_ID,
    playerVars: {
      autoplay: 1, mute: 1, controls: 0,
      modestbranding: 1, rel: 0, playsinline: 1,
      vq: "tiny", start: YT_START_SEC,       /* ← 40 seconds */
      origin: window.location.origin
    },
    events: {
      onReady: (e) => {
        forceLowQuality();
        try { e.target.seekTo(YT_START_SEC, true); } catch (_) {}
        try { e.target.playVideo(); } catch (_) {}
        setTimeout(() => { if (!ytUnmuted) tryYtUnmute(); }, 350);
      },
      onStateChange: (e) => {
        ytPlayerState = e.data;
        if (e.data === 1) {
          audioState.active = true;
          if (ytWatchdog) { clearTimeout(ytWatchdog); ytWatchdog = null; }
          forceLowQuality();
          setTimeout(forceLowQuality, 800);
          if (!ytUnmuted) tryYtUnmute();
        } else if (e.data === 2) setLabel("paused");
        else if (e.data === 3) setLabel("buffering…");
      },
      onError: (e) => {
        console.warn("YouTube error:", e.data);
        if (AUDIO_SOURCE === "auto") switchToMP3("yt-error-" + e.data);
        else setLabel("yt error " + e.data, true);
      }
    }
  });
}

function tryYtUnmute() {
  if (!ytPlayer || ytUnmuted) return;
  try {
    ytPlayer.unMute();
    ytPlayer.setVolume(0);
    ytUnmuted = true;
    fadeVolume(v => { try { ytPlayer.setVolume(v); } catch (_) {} });
  } catch (e) { console.warn("yt unmute failed:", e); }
}

function destroyYT() {
  if (ytWatchdog) { clearTimeout(ytWatchdog); ytWatchdog = null; }
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    try { ytPlayer.destroy(); } catch (_) {}
  }
  ytPlayer = null;
  ytPlayerState = -1;
  ytUnmuted = false;
}

let lastSimBeat = 0;
function ytSimLoop() {
  if (currentSource === "youtube" && audioState.active && ytPlayerState === 1) {
    const t = performance.now();
    const bassEnv = 0.4 + Math.sin(t * 0.0015) * 0.25;
    if (t - lastSimBeat > 480) {
      audioState.beat = 0.7 + Math.random() * 0.3;
      lastSimBeat = t;
    }
    audioState.bass = bassEnv + audioState.beat * 0.35;
    audioState.mid  = 0.35 + Math.sin(t * 0.004) * 0.15 + Math.random() * 0.05;
    audioState.treble = 0.25 + Math.random() * 0.2;
    audioState.beat *= 0.9;
  } else if (currentSource === "youtube") {
    audioState.bass   *= 0.95;
    audioState.mid    *= 0.95;
    audioState.beat   *= 0.9;
    audioState.treble *= 0.95;
  }
  requestAnimationFrame(ytSimLoop);
}
requestAnimationFrame(ytSimLoop);


/* ============================================================
   MP3 CONTROLLER
   ============================================================ */
let audioEl = null;
let audioCtx = null;
let analyser = null;
let dataArr = null;
let analyserRunning = false;
let mp3Unmuted = false;
let beatCooldown = 0;
let prevBass = 0;

function switchToMP3(reason) {
  console.log("→ Switching to MP3 fallback:", reason);
  destroyYT();
  currentSource = "mp3";
  audioState.active = false;
  setLabel("loading…");

  audioEl = new Audio();
  audioEl.crossOrigin = "anonymous";
  audioEl.loop = true;
  audioEl.preload = "auto";
  audioEl.src = MP3_TRACKS[0];
  audioEl.muted = true;
  audioEl.volume = 1;

  audioEl.addEventListener("canplaythrough", onMp3Ready, { once: true });
  audioEl.addEventListener("error", () => {
    console.error("MP3 load failed:", audioEl.src);
    setLabel("mp3 failed", true);
  });

  audioEl.load();
}

function onMp3Ready() {
  audioEl.play().then(() => {
    audioState.active = true;
    setupMp3Analyser();
    setLabel("tap for sound");
    setTimeout(unmuteMp3, 250);
    setTimeout(unmuteMp3, 800);
    setTimeout(unmuteMp3, 1500);
  }).catch(e => {
    console.warn("MP3 autoplay blocked:", e);
    setLabel("tap to play", true);
  });
}

function setupMp3Analyser() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.75;
    dataArr = new Uint8Array(analyser.frequencyBinCount);

    const source = audioCtx.createMediaElementSource(audioEl);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    if (audioCtx.state === "suspended") audioCtx.resume();
    analyserRunning = true;
    analyserTick();
  } catch (e) {
    console.warn("Analyser setup failed:", e);
  }
}

function analyserTick() {
  if (!analyserRunning) return;
  requestAnimationFrame(analyserTick);
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArr);

  const bassEnd = 3, midEnd = 9;
  let bSum = 0, mSum = 0, tSum = 0;
  for (let i = 0; i < bassEnd; i++) bSum += dataArr[i];
  for (let i = bassEnd; i < midEnd; i++) mSum += dataArr[i];
  for (let i = midEnd; i < dataArr.length; i++) tSum += dataArr[i];

  const b = bSum / (bassEnd * 255);
  const m = mSum / ((midEnd - bassEnd) * 255);
  const t = tSum / ((dataArr.length - midEnd) * 255);

  const smooth = (prev, next) => prev + (next - prev) * (next > prev ? 0.4 : 0.1);
  audioState.bass = smooth(audioState.bass, b);
  audioState.mid = smooth(audioState.mid, m);
  audioState.treble = smooth(audioState.treble, t);

  if (beatCooldown > 0) beatCooldown--;
  const delta = b - prevBass;
  if (b > 0.32 && delta > 0.13 && beatCooldown <= 0) {
    audioState.beat = Math.min(1, b * 1.3);
    beatCooldown = 6;
  }
  prevBass = b;

  audioState.beat *= 0.90;
  if (audioState.beat < 0.005) audioState.beat = 0;
}

function unmuteMp3() {
  if (!audioEl || mp3Unmuted) return;
  try {
    audioEl.muted = false;
    audioEl.volume = 0;
    mp3Unmuted = true;
    fadeVolume(v => { audioEl.volume = v / 100; });
  } catch (e) { console.warn("mp3 unmute failed:", e); }
}


/* ============================================================
   BOOT
   ============================================================ */
if (AUDIO_SOURCE === "mp3") switchToMP3("manual");
else startYouTube();

function onAnyInteraction() {
  if (currentSource === "mp3" && !mp3Unmuted) unmuteMp3();
  else if (currentSource === "youtube" && !ytUnmuted) tryYtUnmute();
}
["pointerdown", "keydown", "touchstart", "click", "scroll"].forEach(evt =>
  window.addEventListener(evt, onAnyInteraction, { passive: true })
);
</script>
